name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Start isolated local databases
        run: |
          cp .env.example .env
          dev_password=$(openssl rand -hex 24)
          test_password=$(openssl rand -hex 24)
          sed -i "s/local_dev_only/$dev_password/g; s/local_test_only/$test_password/g" .env
          docker compose --profile test up -d --wait
      - name: Check migration repeatability
        run: |
          npm run db:migrate
          npm run db:migrate
      - run: npm run test:integration
      - run: npx playwright install --with-deps --only-shell chromium
      - name: Build and test browser flow
        run: npm run test:e2e
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: browser-failures
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop CI databases
        if: always()
        run: |
          if [ -f .env ]; then docker compose --profile test down; fi
