name: url-shortener

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: shortener
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env first}
      POSTGRES_DB: url_shortener
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shortener -d url_shortener"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 10s

  db-test:
    image: postgres:17-alpine
    profiles: [test]
    environment:
      POSTGRES_USER: shortener_test
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD:?Copy .env.example to .env first}
      POSTGRES_DB: url_shortener_test
    ports:
      - "127.0.0.1:15433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shortener_test -d url_shortener_test"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 10s

volumes:
  postgres-data:
